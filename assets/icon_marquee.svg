    </clipPath>
    <style>
      @keyframes mqScroll {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(-960px); }
      }
      .mq-track {
        animation: mqScroll 20s linear infinite;
        will-change: transform;
      }
    </style>
  </defs>


